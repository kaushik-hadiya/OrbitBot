[project]
name = "selfrag"
version = "0.1.0"
description = "Self-RAG over a synthetic company knowledge base with LangGraph: retrieval decision, relevance grading, support and usefulness checks, query rewriting, and hybrid BM25 + vector search with reranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.3",
    "ipykernel>=7.4.0",
]
