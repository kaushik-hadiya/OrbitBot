<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OrbitBot: a Self-RAG assistant that checks its own work at every step." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235b5bd6'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%235b5bd6' stroke-width='2' transform='rotate(-30 16 16)'/%3E%3C/svg%3E" />
    <title>OrbitBot</title>
    <script>
      // apply a saved theme before the first paint, so a dark-mode choice doesn't flash light on load
      try {
        var t = localStorage.getItem("orbitbot-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
